archives:
  - id: archive
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macOS
      {{- else if eq .Os "linux" }}Linux
      {{- else if eq .Os "openbsd" }}OpenBSD
      {{- else if eq .Os "netbsd" }}NetBSD
      {{- else if eq .Os "freebsd" }}FreeBSD
      {{- else if eq .Os "dragonfly" }}DragonFlyBSD
      {{- else}}{{- .Os }}{{ end }}-
      {{- if eq .Arch "amd64" }}64bit
      {{- else if eq .Arch "386" }}32bit
      {{- else if eq .Arch "arm" }}ARM
      {{- else if eq .Arch "arm64" }}ARM64
      {{- else if eq .Arch "ppc64le" }}PPC64LE
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE
      - contrib/*.tpl
    format_overrides:
      - goos: windows
        format: zip


dockers:
  - image_templates:
      - "public.ecr.aws/k9v9d5v2/accuknox/trivy:{{ .Version }}-amd64"
      - "public.ecr.aws/k9v9d5v2/accuknox/trivy:latest-amd64"
    use: buildx
    goos: linux
    goarch: amd64
    ids:
      - build-linux
    build_flag_templates:
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description=A Fast Vulnerability Scanner for Containers"
      - "--label=org.opencontainers.image.vendor=AccuKnox"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.source=https://github.com/accuknox/trivy"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--platform=linux/amd64"
    extra_files:
    - contrib/
  - image_templates:
      - "public.ecr.aws/k9v9d5v2/accuknox/trivy:{{ .Version }}-arm64"
      - "public.ecr.aws/k9v9d5v2/accuknox/trivy:latest-arm64"
    use: buildx
    goos: linux
    goarch: arm64
    ids:
      - build-linux
    build_flag_templates:
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description=A Fast Vulnerability Scanner for Containers"
      - "--label=org.opencontainers.image.vendor=AccuKnox"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.source=https://github.com/accuknox/trivy"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--platform=linux/arm64"
    extra_files:
    - contrib/
  - image_templates:
      - "public.ecr.aws/k9v9d5v2/accuknox/trivy:{{ .Version }}-s390x"
      - "public.ecr.aws/k9v9d5v2/accuknox/trivy:latest-s390x"
    use: buildx
    goos: linux
    goarch: s390x
    ids:
      - build-linux
    build_flag_templates:
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description=A Fast Vulnerability Scanner for Containers"
      - "--label=org.opencontainers.image.vendor=AccuKnox"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.source=https://github.com/accuknox/trivy"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--platform=linux/s390x"
    extra_files:
    - contrib/
  - image_templates:
      - "public.ecr.aws/k9v9d5v2/accuknox/trivy:{{ .Version }}-ppc64le"
      - "public.ecr.aws/k9v9d5v2/accuknox/trivy:latest-ppc64le"
    use: buildx
    goos: linux
    goarch: ppc64le
    ids:
      - build-linux
    build_flag_templates:
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description=A Fast Vulnerability Scanner for Containers"
      - "--label=org.opencontainers.image.vendor=AccuKnox"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.source=https://github.com/accuknox/trivy"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--platform=linux/ppc64le"
    extra_files:
    - contrib/

docker_manifests:
  - name_template: 'public.ecr.aws/k9v9d5v2/accuknox/trivy:{{ .Version }}'
    image_templates:
    - 'public.ecr.aws/k9v9d5v2/accuknox/trivy:{{ .Version }}-amd64'
    - 'public.ecr.aws/k9v9d5v2/accuknox/trivy:{{ .Version }}-arm64'
    - 'public.ecr.aws/k9v9d5v2/accuknox/trivy:{{ .Version }}-s390x'
    - 'public.ecr.aws/k9v9d5v2/accuknox/trivy:{{ .Version }}-ppc64le'
  - name_template: 'public.ecr.aws/k9v9d5v2/accuknox/trivy:latest'
    image_templates:
    - 'public.ecr.aws/k9v9d5v2/accuknox/trivy:{{ .Version }}-amd64'
    - 'public.ecr.aws/k9v9d5v2/accuknox/trivy:{{ .Version }}-arm64'
    - 'public.ecr.aws/k9v9d5v2/accuknox/trivy:{{ .Version }}-s390x'
    - 'public.ecr.aws/k9v9d5v2/accuknox/trivy:{{ .Version }}-ppc64le'

