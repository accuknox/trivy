name: Release
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Release
    permissions:
      id-token: write
      contents: read
      attestations: write
    uses: ./.github/workflows/reusable-release.yaml
    with:
      goreleaser_config: goreleaser.yml
      goreleaser_options: "--clean --timeout 90m"
    secrets:
      AWS_DEV_ACCESS_ID: ${{ secrets.AWS_DEV_ACCESS_ID }}
      AWS_DEV_SECRET_ID: ${{ secrets.AWS_DEV_SECRET_ID }}
      GH_ORG_TOKEN: ${{ secrets.GH_ORG_TOKEN }}

